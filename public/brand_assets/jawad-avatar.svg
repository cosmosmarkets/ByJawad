<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none" role="img" aria-label="Cartoon illustration of Jawad at a laptop">
  <rect width="400" height="250" fill="#EDE8DC"/>
  <!-- halftone dots -->
  <circle cx="340" cy="40" r="2" fill="#1B4332" opacity="0.15"/>
  <circle cx="360" cy="55" r="2" fill="#1B4332" opacity="0.12"/>
  <circle cx="50" cy="200" r="2" fill="#E94B3C" opacity="0.2"/>
  <circle cx="70" cy="215" r="2" fill="#E94B3C" opacity="0.15"/>
  <!-- desk -->
  <rect x="80" y="175" width="240" height="8" rx="1" fill="#1B4332" opacity="0.25"/>
  <rect x="100" y="183" width="12" height="45" fill="#1B4332" opacity="0.2"/>
  <rect x="288" y="183" width="12" height="45" fill="#1B4332" opacity="0.2"/>
  <!-- laptop -->
  <rect x="155" y="148" width="90" height="55" rx="3" fill="#F5F0E6" stroke="#1B4332" stroke-width="2.5"/>
  <rect x="162" y="155" width="76" height="38" rx="1" fill="#1B4332" opacity="0.08"/>
  <line x1="148" y1="203" x2="252" y2="203" stroke="#1B4332" stroke-width="3" stroke-linecap="round"/>
  <!-- screen sparkle -->
  <circle cx="185" cy="172" r="3" fill="#E94B3C" opacity="0.7"/>
  <!-- stick figure -->
  <circle cx="200" cy="72" r="22" fill="#F5F0E6" stroke="#1A1A18" stroke-width="2.5"/>
  <!-- hair -->
  <path d="M178 62 Q200 48 222 62" stroke="#1A1A18" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- face -->
  <circle cx="192" cy="74" r="2" fill="#1A1A18"/>
  <circle cx="208" cy="74" r="2" fill="#1A1A18"/>
  <path d="M193 84 Q200 90 207 84" stroke="#1A1A18" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- body -->
  <line x1="200" y1="94" x2="200" y2="145" stroke="#1A1A18" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="200" y1="110" x2="168" y2="135" stroke="#1A1A18" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="200" y1="110" x2="232" y2="135" stroke="#1A1A18" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="200" y1="145" x2="178" y2="175" stroke="#1A1A18" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="200" y1="145" x2="222" y2="175" stroke="#1A1A18" stroke-width="2.5" stroke-linecap="round"/>
  <!-- riso accent on shirt -->
  <ellipse cx="200" cy="118" rx="8" ry="10" fill="#E94B3C" opacity="0.35"/>
  <!-- coffee mug -->
  <rect x="248" y="158" width="18" height="22" rx="2" fill="#F5F0E6" stroke="#1B4332" stroke-width="2"/>
  <path d="M266 165 h6 q4 0 4 8 v6" stroke="#1B4332" stroke-width="2" fill="none"/>
  <!-- plant -->
  <line x1="118" y1="175" x2="118" y2="148" stroke="#2D6A4F" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="118" cy="140" rx="12" ry="8" fill="#2D6A4F" opacity="0.5"/>
  <ellipse cx="108" cy="145" rx="8" ry="6" fill="#1B4332" opacity="0.35"/>
  <ellipse cx="128" cy="143" rx="8" ry="6" fill="#1B4332" opacity="0.35"/>
</svg>
