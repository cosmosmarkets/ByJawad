<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 875" fill="none" role="img" aria-label="Illustration of a freelancer portfolio on screen">
  <rect width="700" height="875" fill="#EDE8DC"/>
  <!-- background halftone -->
  <g opacity="0.12">
    <circle cx="80" cy="100" r="3" fill="#1B4332"/>
    <circle cx="120" cy="100" r="3" fill="#1B4332"/>
    <circle cx="160" cy="100" r="3" fill="#1B4332"/>
    <circle cx="540" cy="750" r="3" fill="#1B4332"/>
    <circle cx="580" cy="750" r="3" fill="#1B4332"/>
    <circle cx="620" cy="750" r="3" fill="#1B4332"/>
  </g>
  <!-- floating portfolio cards -->
  <g transform="translate(420 120) rotate(6)">
    <rect width="200" height="260" rx="4" fill="#F5F0E6" stroke="#1B4332" stroke-width="2"/>
    <rect x="12" y="12" width="176" height="120" rx="2" fill="#1B4332" opacity="0.1"/>
    <rect x="12" y="148" width="100" height="8" rx="1" fill="#1B4332" opacity="0.3"/>
    <rect x="12" y="164" width="140" height="6" rx="1" fill="#1B4332" opacity="0.15"/>
    <circle cx="170" cy="200" r="14" fill="#E94B3C" opacity="0.5"/>
  </g>
  <g transform="translate(60 200) rotate(-4)">
    <rect width="180" height="220" rx="4" fill="#fff" stroke="#1B4332" stroke-width="2"/>
    <rect x="12" y="12" width="156" height="100" rx="2" fill="#E94B3C" opacity="0.15"/>
    <rect x="12" y="128" width="80" height="8" rx="1" fill="#1B4332" opacity="0.25"/>
    <rect x="12" y="144" width="120" height="6" rx="1" fill="#1B4332" opacity="0.12"/>
  </g>
  <!-- main browser window -->
  <rect x="140" y="280" width="420" height="380" rx="6" fill="#F5F0E6" stroke="#1B4332" stroke-width="3"/>
  <rect x="140" y="280" width="420" height="36" rx="6" fill="#1B4332" opacity="0.12"/>
  <circle cx="168" cy="298" r="6" fill="#E94B3C" opacity="0.8"/>
  <circle cx="190" cy="298" r="6" fill="#1B4332" opacity="0.25"/>
  <circle cx="212" cy="298" r="6" fill="#1B4332" opacity="0.25"/>
  <rect x="160" y="340" width="380" height="200" rx="2" fill="#1B4332" opacity="0.06"/>
  <rect x="160" y="560" width="200" height="12" rx="2" fill="#1B4332" opacity="0.2"/>
  <rect x="160" y="584" width="280" height="8" rx="2" fill="#1B4332" opacity="0.1"/>
  <rect x="160" y="604" width="160" height="8" rx="2" fill="#E94B3C" opacity="0.35"/>
  <!-- stick figure at desk -->
  <circle cx="350" cy="720" r="28" fill="#F5F0E6" stroke="#1A1A18" stroke-width="2.5"/>
  <circle cx="340" cy="722" r="3" fill="#1A1A18"/>
  <circle cx="360" cy="722" r="3" fill="#1A1A18"/>
  <path d="M342 734 Q350 742 358 734" stroke="#1A1A18" stroke-width="2" fill="none" stroke-linecap="round"/>
  <line x1="350" y1="748" x2="350" y2="810" stroke="#1A1A18" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="350" y1="770" x2="310" y2="800" stroke="#1A1A18" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="350" y1="770" x2="390" y2="800" stroke="#1A1A18" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="280" y="815" width="140" height="8" rx="1" fill="#1B4332" opacity="0.2"/>
  <!-- riso star -->
  <path d="M580 180 l8 16 l18 2 l-13 12 l3 18 l-16-9 l-16 9 l3-18 l-13-12 l18-2z" fill="#E94B3C" opacity="0.6"/>
